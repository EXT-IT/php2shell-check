name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, yamllint, checksums)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # ShellCheck is pinned: apt ships whatever the runner image has, and a
      # different version reports different findings.
      - name: Install linters
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yamllint xz-utils
          base="https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}"
          curl -fsSLo sc.tar.xz "${base}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  sc.tar.xz" | sha256sum -c -
          tar -xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck
        run: shellcheck -S style -x php2shell-check.sh tests/run_tests.sh tests/cases/*.sh

      - name: yamllint
        run: yamllint --strict .

      - name: SHA256SUMS matches both editions
        run: sha256sum -c SHA256SUMS

      # Two files carrying the same vulnerability table is the one thing that
      # no run of either file can catch: a Linux run never reads the
      # PowerShell table, a Windows run never reads the shell one.
      - name: Vulnerability data parity (shell vs PowerShell)
        run: python3 tests/data_parity.py

  test-linux:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          - image: debian:12
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          - image: debian:13
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          # rockylinux/rockylinux is the maintained repository; the old
          # library/rockylinux one is deprecated and is where the stall of
          # 2026-10-23 happened. Measured on both: 238 tests pass either way.
          - image: rockylinux/rockylinux:9
            setup: dnf install -y -q python3 >/dev/null
          - image: alpine:3.20
            setup: apk add --no-cache -q bash curl python3 coreutils
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # docker run instead of a job container: JavaScript actions do not run
      # inside Alpine, and one pattern for every image keeps the matrix honest.
      - name: Run tests
        env:
          SETUP: ${{ matrix.setup }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -o pipefail
          # The pull is a separate, bounded step. On 2026-10-23 this job was
          # cancelled after 10.2 minutes where it normally takes 0.6, and the
          # log held not one line between the start of the step and the
          # cancel: the registry stalled before docker printed anything, and
          # the output went to a file that is only shown after the run. Now
          # the log says which half hung, a stall fails inside the job budget
          # instead of eating it, and tee keeps the output live.
          timeout 240 docker pull -q "$IMAGE" || timeout 240 docker pull -q "$IMAGE"
          timeout 420 docker run --rm -e SETUP -v "$PWD:/src" -w /src "$IMAGE" \
            sh -c "$SETUP && bash tests/run_tests.sh" 2>&1 | tee tests.log && rc=0 || rc=$?
          # Same reason as the Windows job: the log of a run needs a token, so
          # a red job would say "failure" and nothing else. The Alpine failure
          # of 3.0.0 had to be reproduced on a Docker host to be read at all.
          if [ "$rc" -ne 0 ]; then
            grep -E '^[[:space:]]*(FAIL|skip)|passed, [0-9]+ failed' tests.log \
              | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$rc"

  test-macos:
    name: Tests (macOS, bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Run tests with the system bash
        run: |
          set -o pipefail
          /bin/bash tests/run_tests.sh 2>&1 | tee tests.log && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E '^[[:space:]]*(FAIL|skip)|passed, [0-9]+ failed' tests.log \
              | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$rc"

  test-windows:
    name: Tests (Windows, ${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # powershell is Windows PowerShell 5.1, the one every Windows Server
        # has without an installation; pwsh is PowerShell 7, which many
        # administrators run instead. The script targets 5.1 and must not
        # break on 7.
        shell: [powershell, pwsh]
    # The shell has to be chosen here and not per step: a step's "shell" key is
    # not one of the places where an expression is allowed (it is absent from
    # the context-availability table, while jobs.<id>.defaults.run is listed
    # with matrix), and GitHub rejects the whole file rather than the one line.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Show the host and the shell
        run: |
          $PSVersionTable.PSVersion.ToString()
          (Get-CimInstance Win32_OperatingSystem).Caption

      # Errors only. Measured with PSScriptAnalyzer 1.25.0: zero errors, and
      # the warnings are all deliberate for a console tool run by hand --
      # PSAvoidUsingWriteHost (that is the output), PSUseApprovedVerbs (the
      # test helpers), PSAvoidUsingEmptyCatchBlock (a missing key or file is
      # "nothing there", not a failure), plus two false positives:
      # PSReviewUnusedParameter on $TestRoot, which the functions read from
      # script scope, and PSUseUsingScopeModifierInNewRunspaces on a job that
      # takes its value through -ArgumentList.
      # -Path takes one string, not a list, so the whole tree is scanned.
      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber
          $f = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $f | Format-Table -AutoSize | Out-String
          if ($f) { exit 1 }

      # Two things fight this step. GitHub's PowerShell wrapper sets
      # $ErrorActionPreference to Stop, so a single error record anywhere in
      # the pipeline ends the step before anything can be reported; and the log
      # of a run is not readable without a token, so a red job would otherwise
      # say "failure" and nothing else. The run therefore writes every stream
      # into a file, and the failing cases are repeated as annotations, which
      # the API serves for a public repository.
      - name: Run tests
        run: |
          $ErrorActionPreference = 'Continue'
          ./tests/run_tests.ps1 *> windows-tests.log
          $rc = $LASTEXITCODE
          Get-Content windows-tests.log
          if ($rc -ne 0) {
            $lines = @(Get-Content windows-tests.log)
            $sent = 0
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -notmatch '^\s*(FAIL|skip)' -and $lines[$i] -notmatch 'passed, \d+ failed') { continue }
              if ($sent -ge 9) { break }
              $block = @($lines[$i])
              for ($j = $i + 1; $j -lt [Math]::Min($i + 8, $lines.Count); $j++) {
                if ($lines[$j] -match '^\s{6,}\S') { $block += $lines[$j] } else { break }
              }
              Write-Host ("::error::" + (($block -join '%0A') -replace '::', ' '))
              $sent++
            }
          }
          exit $rc
