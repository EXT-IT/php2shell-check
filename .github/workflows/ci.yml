name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, yamllint, checksums)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # ShellCheck is pinned: apt ships whatever the runner image has, and a
      # different version reports different findings.
      - name: Install linters
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yamllint xz-utils
          base="https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}"
          curl -fsSLo sc.tar.xz "${base}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  sc.tar.xz" | sha256sum -c -
          tar -xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck
        run: shellcheck -S style -x php2shell-check.sh tests/run_tests.sh tests/cases/*.sh

      - name: yamllint
        run: yamllint --strict .

      - name: SHA256SUMS matches the script
        run: sha256sum -c SHA256SUMS

      - name: README one-liner carries the current checksum
        run: |
          sum=$(cut -d' ' -f1 SHA256SUMS)
          grep -q "echo \"$sum  php2shell-check.sh\"" README.md || {
            echo "README one-liner does not contain $sum"; exit 1; }

  test-linux:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          - image: debian:12
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          - image: debian:13
            setup: apt-get update -qq && apt-get install -y -qq bash curl python3 >/dev/null
          - image: rockylinux:9
            setup: dnf install -y -q python3 >/dev/null
          - image: alpine:3.20
            setup: apk add --no-cache -q bash curl python3 coreutils
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # docker run instead of a job container: JavaScript actions do not run
      # inside Alpine, and one pattern for every image keeps the matrix honest.
      - name: Run tests
        env:
          SETUP: ${{ matrix.setup }}
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -e SETUP -v "$PWD:/src" -w /src "$IMAGE" sh -c "$SETUP && bash tests/run_tests.sh"

  test-macos:
    name: Tests (macOS, bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Run tests with the system bash
        run: /bin/bash tests/run_tests.sh
